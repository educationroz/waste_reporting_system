{% extends 'web_app/base.html' %}
{% load static %}

{% block title %}Forgot Password — Waste Collection{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light py-4">
    <div class="card shadow-sm" style="width:420px">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <img src="{% static 'web_app/image/SafhaSahar.png' %}" alt="Logo" width="90" height="90">
                <h4 class="mt-2 fw-bold">Forgot Password</h4>
                <p class="text-muted small mb-0">Enter your email and we'll send you a reset link.</p>
            </div>

            <div id="error-alert" class="alert alert-danger d-none"></div>
            <div id="success-alert" class="alert alert-success d-none"></div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" autofocus>
            </div>

            <button class="btn btn-success w-100" id="submit-btn" onclick="requestReset()">
                <span id="submit-text">Send Reset Link</span>
                <span id="submit-spinner" class="spinner-border spinner-border-sm d-none ms-2"></span>
            </button>

            <p class="text-center mt-3 mb-0 small">
                Remembered your password? <a href="{% url 'login' %}" class="text-success">Sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function requestReset() {
    const errDiv = document.getElementById('error-alert');
    const sucDiv = document.getElementById('success-alert');
    const spinner = document.getElementById('submit-spinner');
    const text = document.getElementById('submit-text');
    const btn = document.getElementById('submit-btn');
    errDiv.classList.add('d-none');
    sucDiv.classList.add('d-none');

    const email = document.getElementById('email').value.trim();
    if (!email) {
        errDiv.textContent = 'Please enter your email.';
        errDiv.classList.remove('d-none');
        return;
    }

    spinner.classList.remove('d-none');
    text.textContent = 'Sending...';

    try {
        const res = await fetch('/auth/password-reset/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email }),
        });
        const data = await res.json();

        if (res.ok) {
            // Backend always returns a generic success message here regardless
            // of whether the email exists, to avoid leaking which emails are registered.
            sucDiv.textContent = data.message || 'If an account with that email exists, a reset link has been sent.';
            sucDiv.classList.remove('d-none');
            btn.disabled = true;
            text.textContent = 'Link Sent';
        } else {
            const msgs = Object.entries(data).map(([k, v]) => `${k}: ${Array.isArray(v) ? v.join(', ') : v}`).join('<br>');
            errDiv.innerHTML = msgs || 'Something went wrong.';
            errDiv.classList.remove('d-none');
        }
    } catch (e) {
        errDiv.textContent = 'Network error: ' + e.message;
        errDiv.classList.remove('d-none');
    } finally {
        spinner.classList.add('d-none');
        if (!btn.disabled) {
            text.textContent = 'Send Reset Link';
        }
    }
}
</script>
{% endblock %}
