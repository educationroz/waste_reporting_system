{% extends 'web_app/base.html' %}
{% load static %}

{% block title %}Register — Waste Collection{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light py-4 px-3">
    <div class="card shadow-sm w-100" style="max-width:440px">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <img src="{% static 'web_app/image/SafhaSahar.png' %}" alt="Logo" width="100" height="100" class="d-inline-block align-text-top me-2">
                <h4 class="mt-2 fw-bold">Create Account</h4>
            </div>

            <div id="error-alert" class="alert alert-danger d-none"></div>
            <div id="success-alert" class="alert alert-success d-none"></div>

            <div id="g_id_signin_container" class="d-flex justify-content-center mb-3"></div>

            <div class="d-flex align-items-center mb-3">
                <hr class="flex-grow-1">
                <span class="px-2 text-muted small">or register with email</span>
                <hr class="flex-grow-1">
            </div>

            <div class="row">
                <div class="col-12 col-sm-6 mb-3">
                    <label class="form-label">Username *</label>
                    <input type="text" id="username" class="form-control" autofocus>
                </div>
                <div class="col-12 col-sm-6 mb-3">
                    <label class="form-label">Email *</label>
                    <input type="email" id="email" class="form-control">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="tel" id="phone" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Role *</label>
                <select id="role" class="form-select">
                    <option value="user">Regular User</option>
                    {% comment %} <option value="driver">Driver</option> {% endcomment %}
                </select>
            </div>
            <div class="row">
                <div class="col-12 col-sm-6 mb-3">
                    <label class="form-label">Password *</label>
                    <div class="position-relative">
                        <input type="password" id="password" class="form-control pe-5" oninput="handlePasswordInput()">
                        <i class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-3 text-muted"
                            id="toggle-password-icon" style="cursor: pointer; display: none;" onclick="togglePassword()"></i>
                    </div>
                </div>
                <div class="col-12 col-sm-6 mb-3">
                    <label class="form-label">Confirm Password *</label>
                    <div class="position-relative">
                        <input type="password" id="password2" class="form-control pe-5" oninput="handlePassword2Input()">
                        <i class="bi bi-eye position-absolute top-50 end-0 translate-middle-y me-3 text-muted"
                            id="toggle-password2-icon" style="cursor: pointer; display: none;" onclick="togglePassword2()"></i>
                    </div>
                </div>
            </div>

            <button class="btn btn-success w-100" id="reg-btn" onclick="doRegister()">
                <span id="reg-text">Create Account</span>
                <span id="reg-spinner" class="spinner-border spinner-border-sm d-none ms-2"></span>
            </button>

            <p class="text-center mt-3 mb-0 small">
                Already have an account? <a href="{% url 'login' %}" class="text-success">Sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<style>
    /* ब्राउजरहरूको आफ्नै डिफल्ट रिभिल/क्लियर बटन पूर्ण रूपमा फाल्न */
    input::-webkit-reveal,
    input::-webkit-clear-button {
        display: none !important;
    }

    input::-ms-reveal,
    input::-ms-clear {
        display: none !important;
    }
</style>

<!-- Google Identity Services SDK -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
(function() {
const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

window.doRegister = async function() {
    const errDiv = document.getElementById('error-alert');
    const sucDiv = document.getElementById('success-alert');
    const spinner = document.getElementById('reg-spinner');
    const text = document.getElementById('reg-text');
    const btn = document.getElementById('reg-btn');
    errDiv.classList.add('d-none');
    sucDiv.classList.add('d-none');

    const payload = {
        username: document.getElementById('username').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        role: document.getElementById('role').value,
        password: document.getElementById('password').value,
        password2: document.getElementById('password2').value,
    };

    if (!payload.username || !payload.email || !payload.password) {
        errDiv.textContent = 'Username, email and password are required.';
        errDiv.classList.remove('d-none');
        return;
    }

    if (!emailRegex.test(payload.email)) {
        errDiv.textContent = 'Please enter a valid email address.';
        errDiv.classList.remove('d-none');
        return;
    }

    spinner.classList.remove('d-none');
    text.textContent = 'Creating...';

    try {
        const res = await fetch('/auth/register/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken'),
            },
            body: JSON.stringify(payload),
        });
        const data = await res.json();

        if (res.ok) {
            // No tokens are issued at this point — the account is inactive
            // until the user clicks the verification link emailed to them.
            sucDiv.textContent = data.message || 'Account created! Please check your email to verify your account before logging in.';
            sucDiv.classList.remove('d-none');
            btn.disabled = true;
            text.textContent = 'Check your email';

            setTimeout(() => window.location.href = "{% url 'login' %}", 3000);
        } else {
            const msgs = Object.entries(data).map(([k,v]) => `${k}: ${Array.isArray(v) ? v.join(', ') : v}`).join('<br>');
            errDiv.innerHTML = msgs || 'Registration failed.';
            errDiv.classList.remove('d-none');
        }
    } catch (e) {
        errDiv.textContent = 'Network error: ' + e.message;
        errDiv.classList.remove('d-none');
    } finally {
        spinner.classList.add('d-none');
        if (!btn.disabled) {
            text.textContent = 'Create Account';
        }
    }
};

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        document.cookie.split(';').forEach(cookie => {
            const c = cookie.trim();
            if (c.startsWith(name + '=')) {
                cookieValue = decodeURIComponent(c.slice(name.length + 1));
            }
        });
    }
    return cookieValue;
}

// ── Google Sign-In ───────────────────────────────────────────────────────────
// Google le nai email verify garisakeko huncha, tesaile Google le banaeko
// account seedhai active huncha — hamro afnai verification-email step
// yaha skip huncha (backend ko GoogleLoginView herun्).
function initGoogleSignIn() {
    if (typeof google === 'undefined' || !google.accounts) {
        setTimeout(initGoogleSignIn, 200);
        return;
    }
    google.accounts.id.initialize({
        client_id: '{{ GOOGLE_CLIENT_ID }}',
        callback: handleGoogleCredential,
        use_fedcm_for_button: true,
    });
    google.accounts.id.renderButton(
        document.getElementById('g_id_signin_container'),
        { theme: 'outline', size: 'large', width: 320, text: 'signup_with' }
    );
}
initGoogleSignIn();

async function handleGoogleCredential(response) {
    const errDiv = document.getElementById('error-alert');
    errDiv.classList.add('d-none');

    try {
        const res = await fetch('/auth/google-login/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken'),
            },
            body: JSON.stringify({ credential: response.credential }),
        });
        const data = await res.json();

        if (res.ok) {
            localStorage.setItem('access_token', data.access);
            localStorage.setItem('refresh_token', data.refresh);

            const role = data.user?.role || '';
            const redirectMap = {
                admin: '/admin-dashboard/',
                driver: '/driver-dashboard/',
                user: '/',
            };
            window.location.href = redirectMap[role] || '/dashboard/';
        } else {
            errDiv.textContent = data.error || 'Google sign-in failed.';
            errDiv.classList.remove('d-none');
        }
    } catch (e) {
        errDiv.textContent = 'Network error: ' + e.message;
        errDiv.classList.remove('d-none');
    }
}

// Enter key थिच्दा अर्को इनपुट फिल्डमा फोकस लैजाने लोजिक
const fieldOrder = ['username', 'email', 'phone', 'role', 'password', 'password2'];

fieldOrder.forEach((id, idx) => {
    const el = document.getElementById(id);
    if (el) {
        el.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                e.preventDefault();
                const nextId = fieldOrder[idx + 1];
                if (nextId) {
                    document.getElementById(nextId).focus();
                } else {
                    doRegister();
                }
            }
        });
    }
});

// पहिलो Password फिल्डको लागि Eye Icon कन्ट्रोल
function handlePasswordInput() {
    const pwdInput = document.getElementById('password');
    const icon = document.getElementById('toggle-password-icon');
    if (pwdInput.value.length > 0) {
        icon.style.display = 'block';
    } else {
        icon.style.display = 'none';
    }
}
window.handlePasswordInput = handlePasswordInput;

function togglePassword() {
    const pwdInput = document.getElementById('password');
    const icon = document.getElementById('toggle-password-icon');
    if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        pwdInput.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
}
window.togglePassword = togglePassword;

// दोस्रो (Confirm) Password फिल्डको लागि Eye Icon कन्ट्रोल
function handlePassword2Input() {
    const pwdInput = document.getElementById('password2');
    const icon = document.getElementById('toggle-password2-icon');
    if (pwdInput.value.length > 0) {
        icon.style.display = 'block';
    } else {
        icon.style.display = 'none';
    }
}
window.handlePassword2Input = handlePassword2Input;

function togglePassword2() {
    const pwdInput = document.getElementById('password2');
    const icon = document.getElementById('toggle-password2-icon');
    if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
    } else {
        pwdInput.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
    }
}
window.togglePassword2 = togglePassword2;
})();
</script>
{% endblock %}
