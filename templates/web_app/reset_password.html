{% extends 'web_app/base.html' %}
{% load static %}

{% block title %}Reset Password — Waste Collection{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light py-4">
    <div class="card shadow-sm" style="width:420px">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <img src="{% static 'web_app/image/SafhaSahar.png' %}" alt="Logo" width="90" height="90">
                <h4 class="mt-2 fw-bold">Reset Password</h4>
            </div>

            <div id="error-alert" class="alert alert-danger d-none"></div>
            <div id="success-alert" class="alert alert-success d-none"></div>

            <div class="mb-3">
                <label class="form-label">New Password</label>
                <input type="password" id="new_password" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Confirm New Password</label>
                <input type="password" id="new_password2" class="form-control">
            </div>

            <button class="btn btn-success w-100" id="submit-btn" onclick="confirmReset()">
                <span id="submit-text">Reset Password</span>
                <span id="submit-spinner" class="spinner-border spinner-border-sm d-none ms-2"></span>
            </button>

            <p class="text-center mt-3 mb-0 small">
                <a href="{% url 'login' %}" class="text-success">Back to Sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// uid and token come from the URL path this page was loaded at:
// /reset-password/<uidb64>/<token>/
// Adjust this parsing if your urls.py route for this page uses a different shape.
const pathParts = window.location.pathname.split('/').filter(Boolean);
// pathParts example: ['reset-password', '<uidb64>', '<token>']
const uidb64 = pathParts[1];
const token = pathParts[2];

async function confirmReset() {
    const errDiv = document.getElementById('error-alert');
    const sucDiv = document.getElementById('success-alert');
    const spinner = document.getElementById('submit-spinner');
    const text = document.getElementById('submit-text');
    const btn = document.getElementById('submit-btn');
    errDiv.classList.add('d-none');
    sucDiv.classList.add('d-none');

    const new_password = document.getElementById('new_password').value;
    const new_password2 = document.getElementById('new_password2').value;

    if (!new_password || !new_password2) {
        errDiv.textContent = 'Please fill in both password fields.';
        errDiv.classList.remove('d-none');
        return;
    }

    if (!uidb64 || !token) {
        errDiv.textContent = 'This reset link is malformed. Please request a new one.';
        errDiv.classList.remove('d-none');
        return;
    }

    spinner.classList.remove('d-none');
    text.textContent = 'Resetting...';

    try {
        const res = await fetch('/auth/password-reset-confirm/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uidb64, token, new_password, new_password2 }),
        });
        const data = await res.json();

        if (res.ok) {
            sucDiv.textContent = data.message || 'Password has been reset. You can now log in.';
            sucDiv.classList.remove('d-none');
            btn.disabled = true;
            text.textContent = 'Done';
            setTimeout(() => window.location.href = "{% url 'login' %}", 2000);
        } else {
            const msgs = Object.entries(data).map(([k, v]) => `${k}: ${Array.isArray(v) ? v.join(', ') : v}`).join('<br>');
            errDiv.innerHTML = msgs || 'This reset link is invalid or has expired.';
            errDiv.classList.remove('d-none');
        }
    } catch (e) {
        errDiv.textContent = 'Network error: ' + e.message;
        errDiv.classList.remove('d-none');
    } finally {
        spinner.classList.add('d-none');
        if (!btn.disabled) {
            text.textContent = 'Reset Password';
        }
    }
}
</script>
{% endblock %}
